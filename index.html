<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>墨書傳奇</title>
  <style>
    :root { font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; background: #f6f1e8; color: #202020; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: linear-gradient(135deg, rgba(49,80,97,.14), transparent 42%), linear-gradient(315deg, rgba(142,54,48,.12), transparent 48%), #f6f1e8; }
    main { width: min(960px, calc(100% - 32px)); margin: 0 auto; padding: 56px 0; }
    h1 { margin: 0 0 12px; font-size: clamp(2.25rem, 7vw, 4.5rem); line-height: 1; letter-spacing: 0; }
    p { margin: 0 0 32px; color: #525252; font-size: 1.08rem; line-height: 1.7; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
    a { display: grid; min-height: 148px; padding: 22px; border: 1px solid rgba(32,32,32,.14); border-radius: 8px; background: rgba(255,255,255,.72); color: inherit; text-decoration: none; box-shadow: 0 12px 30px rgba(40,36,30,.08); transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease; }
    a:hover, a:focus-visible { transform: translateY(-2px); border-color: rgba(49,80,97,.45); box-shadow: 0 18px 36px rgba(40,36,30,.13); outline: none; }
    strong { align-self: end; font-size: 1.35rem; line-height: 1.3; }
    span { color: #666; font-size: .95rem; line-height: 1.55; }
  </style>
</head>
<body>
  <main>
    <h1>墨書傳奇</h1>
    <p>選擇一個關卡開始遊玩。</p>
    <div class="grid" aria-label="遊戲列表">
      <a href="./大冒險地圖/"><span>主線地圖</span><strong>大冒險地圖</strong></a>
      <a href="./示範1_朝代配對/"><span>示範 1</span><strong>朝代配對</strong></a>
      <a href="./示範2_成語填字/"><span>示範 2</span><strong>成語填字</strong></a>
      <a href="./示範3_打怪RPG/"><span>示範 3</span><strong>打怪 RPG</strong></a>
    </div>
  </main>
</body>
</html>
