<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成語填字遊戲</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Serif TC', serif;
  min-height: 100vh;
  background-color: #f5ead0;
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(180,140,80,0.12) 39px, rgba(180,140,80,0.12) 40px),
    repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(180,140,80,0.08) 39px, rgba(180,140,80,0.08) 40px);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px 16px 40px;
  user-select: none;
}

/* ── 標題 ── */
header {
  text-align: center;
  margin-bottom: 20px;
}
header h1 {
  font-size: 2.2rem;
  font-weight: 900;
  color: #5c2a00;
  letter-spacing: 0.15em;
  text-shadow: 2px 2px 0 rgba(120,60,0,0.2);
}
header p {
  font-size: 0.9rem;
  color: #8b5a2b;
  margin-top: 4px;
  letter-spacing: 0.1em;
}

/* ── 進度條 ── */
#progress-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 22px;
}
.prog-dot {
  width: 14px; height: 14px;
  border-radius: 50%;
  border: 2px solid #a0663a;
  background: transparent;
  transition: background 0.3s;
}
.prog-dot.done { background: #c0392b; border-color: #c0392b; }
.prog-dot.current { background: #f5b942; border-color: #a0663a; }

/* ── 主卡片 ── */
#game-card {
  background: rgba(255,250,235,0.92);
  border: 2px solid #c8a86b;
  border-radius: 10px;
  box-shadow: 4px 4px 16px rgba(100,60,10,0.18), inset 0 0 30px rgba(200,160,80,0.06);
  padding: 28px 24px 32px;
  width: 100%;
  max-width: 680px;
}

/* ── 題號 ── */
#question-label {
  font-size: 0.85rem;
  color: #8b5a2b;
  letter-spacing: 0.1em;
  margin-bottom: 10px;
}

/* ── 成語展示列 ── */
#idiom-row {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-bottom: 22px;
  flex-wrap: wrap;
}

.idiom-char {
  width: 76px; height: 76px;
  display: flex; align-items: center; justify-content: center;
  font-size: 2.6rem;
  font-weight: 700;
  color: #3d1a00;
  border-radius: 4px;
  border: 1.5px solid transparent;
  background: rgba(200,160,80,0.08);
  transition: color 0.3s, background 0.3s, box-shadow 0.3s;
}

.drop-slot {
  border: 2.5px solid #c0392b;
  background: rgba(192,57,43,0.04);
  position: relative;
  cursor: default;
}
.drop-slot.drag-over {
  background: rgba(192,57,43,0.12);
  box-shadow: 0 0 0 3px rgba(192,57,43,0.3);
}
.drop-slot.correct {
  border-color: #c0392b;
  background: rgba(192,57,43,0.07);
  cursor: default;
}
.drop-slot.correct .slot-char {
  color: #c0392b;
  font-weight: 900;
  text-shadow: 1px 1px 2px rgba(150,0,0,0.25);
}

/* 空格內紅色方框符號 */
.drop-slot::before {
  content: '□';
  position: absolute;
  font-size: 2.6rem;
  color: rgba(192,57,43,0.4);
  pointer-events: none;
  transition: opacity 0.2s;
}
.drop-slot.filled::before { opacity: 0; }

.slot-char {
  position: relative;
  z-index: 1;
  font-size: 2.6rem;
  font-weight: 700;
}

/* ── 意思提示 ── */
#meaning-box {
  display: none;
  background: rgba(245,185,66,0.12);
  border: 1px solid #c8a86b;
  border-radius: 6px;
  padding: 12px 16px;
  margin-bottom: 18px;
  font-size: 1rem;
  color: #5c2a00;
  line-height: 1.7;
  text-align: center;
  letter-spacing: 0.05em;
}
#meaning-box .correct-label {
  font-size: 1.2rem;
  font-weight: 700;
  color: #c0392b;
  display: block;
  margin-bottom: 6px;
}

/* ── 字卡區 ── */
#cards-area {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  min-height: 56px;
}

.char-card {
  width: 56px; height: 56px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.6rem;
  font-weight: 700;
  color: #3d1a00;
  border-radius: 6px;
  border: 1.5px solid #b8934a;
  background: linear-gradient(160deg, #fdf3d0 0%, #f5e4a8 60%, #eddaa0 100%);
  box-shadow: 2px 2px 5px rgba(100,60,10,0.2), inset 0 1px 0 rgba(255,255,255,0.5);
  cursor: grab;
  touch-action: none;
  transition: transform 0.12s, box-shadow 0.12s, opacity 0.15s;
}
.char-card:active { cursor: grabbing; }
.char-card.dragging {
  opacity: 0.4;
  transform: scale(0.95);
}
.char-card.ghost {
  position: fixed;
  pointer-events: none;
  z-index: 9999;
  opacity: 0.88;
  transform: scale(1.12);
  box-shadow: 4px 6px 18px rgba(80,30,0,0.35);
}
.char-card.wrong-flash {
  animation: wrongFlash 0.22s ease;
}
.char-card.used {
  opacity: 0;
  pointer-events: none;
}
@keyframes wrongFlash {
  0%   { background: #ffcccc; box-shadow: 0 0 10px rgba(220,50,50,0.7); }
  50%  { background: #ff8888; box-shadow: 0 0 18px rgba(220,50,50,0.9); }
  100% { background: linear-gradient(160deg, #fdf3d0 0%, #f5e4a8 60%, #eddaa0 100%); box-shadow: 2px 2px 5px rgba(100,60,10,0.2); }
}

/* ── 按鈕 ── */
.btn {
  display: block;
  margin: 18px auto 0;
  padding: 10px 36px;
  font-family: 'Noto Serif TC', serif;
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  color: #fff8ee;
  background: linear-gradient(160deg, #a0562a 0%, #7a3a12 100%);
  border: none;
  border-radius: 6px;
  box-shadow: 2px 3px 8px rgba(80,30,0,0.3);
  cursor: pointer;
  transition: transform 0.1s, box-shadow 0.1s;
}
.btn:hover { transform: translateY(-2px); box-shadow: 3px 5px 12px rgba(80,30,0,0.35); }
.btn:active { transform: translateY(0); }

/* ── 結果畫面 ── */
#result-screen {
  display: none;
  text-align: center;
}
#result-screen h2 {
  font-size: 1.8rem;
  font-weight: 900;
  color: #5c2a00;
  margin-bottom: 14px;
}
#result-screen .score-display {
  font-size: 3.5rem;
  font-weight: 900;
  color: #c0392b;
  margin: 10px 0 6px;
  text-shadow: 2px 2px 0 rgba(120,0,0,0.15);
}
#result-screen .score-sub {
  font-size: 1rem;
  color: #8b5a2b;
  margin-bottom: 20px;
}
.result-list {
  list-style: none;
  text-align: left;
  margin: 0 auto 18px;
  max-width: 340px;
  border-top: 1px solid #c8a86b;
}
.result-list li {
  padding: 8px 4px;
  border-bottom: 1px solid #e8d8b0;
  font-size: 0.95rem;
  color: #5c2a00;
  display: flex;
  gap: 10px;
  align-items: center;
}
.result-list .r-idiom { font-weight: 700; font-size: 1.05rem; }
.result-list .r-ok  { color: #27ae60; font-size: 1.1rem; }
.result-list .r-bad { color: #c0392b; font-size: 1.1rem; }

/* ── 音效 ── */
/* 用 AudioContext 合成，不需外部檔案 */

/* ── 回到大地圖 ── */
#btn-back-map {
  position: fixed;
  top: 12px; left: 12px;
  z-index: 500;
  background: rgba(240,225,190,.85);
  border: 1px solid #a0663a;
  border-radius: 8px;
  color: #5c2a00;
  font-family: 'Noto Serif TC', serif;
  font-size: .82rem;
  padding: 7px 14px;
  cursor: pointer;
  letter-spacing: .05em;
  text-decoration: none;
  display: inline-block;
  transition: background .2s, border-color .2s;
}
#btn-back-map:hover {
  background: rgba(255,245,215,.95);
  border-color: #7a3a12;
}
</style>
</head>
<body>

<a id="btn-back-map" href="../大冒險地圖/index.html">← 回到大地圖</a>

<header>
  <h1>成語填字</h1>
  <p>拖曳字卡，填入正確的字</p>
</header>

<div id="progress-bar"></div>

<div id="game-card">
  <div id="question-label"></div>
  <div id="idiom-row"></div>
  <div id="meaning-box"></div>
  <div id="cards-area"></div>
  <button class="btn" id="next-btn" style="display:none">下一題 →</button>

  <div id="result-screen">
    <h2>挑戰完成！</h2>
    <div class="score-display" id="score-num"></div>
    <div class="score-sub">答對題數 / 共 5 題</div>
    <ul class="result-list" id="result-list"></ul>
    <button class="btn" id="restart-btn">再玩一次</button>
  </div>
</div>

<script>
// ════════════════════════════════════════
//  題庫
// ════════════════════════════════════════
const QUESTIONS = [
  { 成語: '一鳴驚人', 缺字: [1, 3], 答案: ['鳴', '人'], 意思: '比喻平時默默無聞，突然有驚人表現。' },
  { 成語: '風花雪月', 缺字: [0, 2], 答案: ['風', '雪'], 意思: '原指四時景色，後比喻浮華空洞的詩文。' },
  { 成語: '三番五次', 缺字: [1, 3], 答案: ['番', '次'], 意思: '形容次數很多，反覆多次。' },
  { 成語: '一字千金', 缺字: [1, 3], 答案: ['字', '金'], 意思: '形容文字價值極高，不可更改。' },
  { 成語: '畫龍點睛', 缺字: [1, 3], 答案: ['龍', '睛'], 意思: '比喻在關鍵處點明要旨，使整體生動。' },
  { 成語: '半途而廢', 缺字: [0, 2], 答案: ['半', '而'], 意思: '比喻做事有始無終，中途放棄。' },
  { 成語: '水滴石穿', 缺字: [1, 3], 答案: ['滴', '穿'], 意思: '比喻只要堅持不懈，終能成功。' },
  { 成語: '亡羊補牢', 缺字: [1, 3], 答案: ['羊', '牢'], 意思: '比喻事後補救，亡羊後才修補羊圈。' },
  { 成語: '對牛彈琴', 缺字: [1, 3], 答案: ['牛', '琴'], 意思: '比喻對不懂事的人講大道理，白費口舌。' },
  { 成語: '青出於藍', 缺字: [0, 2], 答案: ['青', '於'], 意思: '比喻學生或晚輩超越師長或前輩。' },
  { 成語: '守株待兔', 缺字: [1, 3], 答案: ['株', '兔'], 意思: '比喻不知變通，坐等機會到來。' },
  { 成語: '鐵杵磨針', 缺字: [1, 3], 答案: ['杵', '針'], 意思: '比喻只要有恆心，再難的事也能成功。' },
  { 成語: '狐假虎威', 缺字: [0, 2], 答案: ['狐', '虎'], 意思: '比喻仗著別人的勢力欺壓人。' },
  { 成語: '塞翁失馬', 缺字: [1, 3], 答案: ['翁', '馬'], 意思: '比喻得失之間難以預料，禍福相倚。' },
  { 成語: '掩耳盜鈴', 缺字: [1, 3], 答案: ['耳', '鈴'], 意思: '比喻自欺欺人，以為別人不知道。' },
];

// ════════════════════════════════════════
//  干擾字池
// ════════════════════════════════════════
const DISTRACTOR_POOL = [
  '山','水','火','木','金','土','天','地','人','心',
  '日','月','風','雨','雲','花','草','石','鳥','魚',
  '春','夏','秋','冬','東','西','南','北','大','小',
  '上','下','左','右','前','後','明','暗','高','低',
  '新','舊','真','假','善','惡','美','醜','快','慢',
  '書','筆','字','學','教','讀','寫','問','答','知',
  '國','家','民','朋','友','師','生','父','母','兄',
  '路','橋','門','窗','室','堂','樓','城','村','野',
  '船','車','馬','牛','羊','豬','鼠','虎','龍','蛇',
  '力','勇','智','信','義','禮','仁','忠','孝','廉',
];

// ════════════════════════════════════════
//  音效（Web Audio API 合成）
// ════════════════════════════════════════
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playCorrect() {
  try {
    const ctx = getAudioCtx();
    const freqs = [523, 659, 784, 1047];
    freqs.forEach((f, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = f;
      osc.type = 'sine';
      const t = ctx.currentTime + i * 0.07;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.18, t + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
      osc.start(t); osc.stop(t + 0.25);
    });
  } catch(e) {}
}
function playWrong() {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 180;
    osc.type = 'sawtooth';
    const t = ctx.currentTime;
    gain.gain.setValueAtTime(0.15, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    osc.start(t); osc.stop(t + 0.2);
  } catch(e) {}
}

// ════════════════════════════════════════
//  工具函式
// ════════════════════════════════════════
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function pickDistractors(correct, count) {
  const pool = DISTRACTOR_POOL.filter(c => !correct.includes(c));
  return shuffle(pool).slice(0, count);
}
function pickQuestions(n) {
  return shuffle(QUESTIONS).slice(0, n);
}

// ════════════════════════════════════════
//  遊戲狀態
// ════════════════════════════════════════
let questions = [];
let currentQ = 0;
let score = 0;
let results = [];
let slotsState = [];   // [{index, answer, filled}]
let dragCard = null;   // {el, char, originIndex}
let ghostEl = null;
let touchOffset = {x:0, y:0};

// ════════════════════════════════════════
//  DOM 引用
// ════════════════════════════════════════
const progressBar = document.getElementById('progress-bar');
const questionLabel = document.getElementById('question-label');
const idiomRow = document.getElementById('idiom-row');
const meaningBox = document.getElementById('meaning-box');
const cardsArea = document.getElementById('cards-area');
const nextBtn = document.getElementById('next-btn');
const resultScreen = document.getElementById('result-screen');
const scoreNum = document.getElementById('score-num');
const resultList = document.getElementById('result-list');
const restartBtn = document.getElementById('restart-btn');

// ════════════════════════════════════════
//  初始化 / 重置
// ════════════════════════════════════════
function startGame() {
  questions = pickQuestions(5);
  currentQ = 0;
  score = 0;
  results = [];
  resultScreen.style.display = 'none';
  idiomRow.style.display = '';
  meaningBox.style.display = 'none';
  cardsArea.style.display = '';
  questionLabel.style.display = '';
  buildProgressBar();
  loadQuestion();
}

function buildProgressBar() {
  progressBar.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const d = document.createElement('div');
    d.className = 'prog-dot' + (i === 0 ? ' current' : '');
    d.id = `dot-${i}`;
    progressBar.appendChild(d);
  }
}
function updateProgressBar() {
  for (let i = 0; i < 5; i++) {
    const d = document.getElementById(`dot-${i}`);
    if (i < currentQ) { d.className = 'prog-dot done'; }
    else if (i === currentQ) { d.className = 'prog-dot current'; }
    else { d.className = 'prog-dot'; }
  }
}

// ════════════════════════════════════════
//  載入單題
// ════════════════════════════════════════
function loadQuestion() {
  const q = questions[currentQ];
  questionLabel.textContent = `第 ${currentQ + 1} 題 / 共 5 題`;
  meaningBox.style.display = 'none';
  nextBtn.style.display = 'none';
  updateProgressBar();

  // 成語列
  idiomRow.innerHTML = '';
  slotsState = [];
  const chars = [...q.成語];
  chars.forEach((ch, i) => {
    const div = document.createElement('div');
    if (q.缺字.includes(i)) {
      div.className = 'idiom-char drop-slot';
      div.dataset.slotIndex = i;
      const slotIdx = q.缺字.indexOf(i);
      div.dataset.answer = q.答案[slotIdx];
      const span = document.createElement('span');
      span.className = 'slot-char';
      div.appendChild(span);
      slotsState.push({ el: div, answer: q.答案[slotIdx], filled: false });

      // 桌機拖曳事件
      div.addEventListener('dragover', e => { e.preventDefault(); div.classList.add('drag-over'); });
      div.addEventListener('dragleave', () => div.classList.remove('drag-over'));
      div.addEventListener('drop', e => { e.preventDefault(); div.classList.remove('drag-over'); handleDrop(div); });
    } else {
      div.className = 'idiom-char';
      div.textContent = ch;
    }
    idiomRow.appendChild(div);
  });

  // 字卡
  const distractors = pickDistractors(q.答案, 13);
  const allCards = shuffle([...q.答案, ...distractors]);
  cardsArea.innerHTML = '';
  allCards.forEach(ch => {
    const card = document.createElement('div');
    card.className = 'char-card';
    card.textContent = ch;
    card.dataset.char = ch;
    card.draggable = true;

    // 桌機拖曳
    card.addEventListener('dragstart', e => {
      dragCard = { el: card, char: ch };
      setTimeout(() => card.classList.add('dragging'), 0);
    });
    card.addEventListener('dragend', () => {
      card.classList.remove('dragging');
      dragCard = null;
    });

    // 觸控拖曳
    card.addEventListener('touchstart', touchStart, { passive: false });
    card.addEventListener('touchmove', touchMove, { passive: false });
    card.addEventListener('touchend', touchEnd, { passive: false });

    cardsArea.appendChild(card);
  });
}

// ════════════════════════════════════════
//  拖放判定
// ════════════════════════════════════════
function handleDrop(slotEl) {
  if (!dragCard) return;
  const slot = slotsState.find(s => s.el === slotEl);
  if (!slot || slot.filled) return;

  if (dragCard.char === slot.answer) {
    // 答對
    slot.filled = true;
    slotEl.querySelector('.slot-char').textContent = dragCard.char;
    slotEl.classList.add('correct', 'filled');
    dragCard.el.classList.add('used');
    playCorrect();
    checkAllFilled();
  } else {
    // 答錯
    playWrong();
    const card = dragCard.el;
    card.classList.add('wrong-flash');
    slotEl.classList.add('drag-over');
    setTimeout(() => {
      card.classList.remove('wrong-flash');
      slotEl.classList.remove('drag-over');
    }, 220);
  }
}

function checkAllFilled() {
  if (slotsState.every(s => s.filled)) {
    score++;
    results.push({ 成語: questions[currentQ].成語, ok: true });
    showMeaning();
  }
}

function showMeaning() {
  const q = questions[currentQ];
  meaningBox.innerHTML = `<span class="correct-label">✓ 答對了！</span>【${q.成語}】${q.意思}`;
  meaningBox.style.display = 'block';
  nextBtn.style.display = 'block';
  nextBtn.textContent = currentQ < 4 ? '下一題 →' : '查看成績';
  // 禁用字卡
  cardsArea.querySelectorAll('.char-card').forEach(c => {
    if (!c.classList.contains('used')) {
      c.draggable = false;
      c.style.opacity = '0.35';
      c.style.cursor = 'default';
    }
  });
}

// ════════════════════════════════════════
//  觸控拖曳實作
// ════════════════════════════════════════
function touchStart(e) {
  e.preventDefault();
  const touch = e.touches[0];
  const card = e.currentTarget;
  dragCard = { el: card, char: card.dataset.char };
  card.classList.add('dragging');

  // 建立 ghost
  ghostEl = card.cloneNode(true);
  ghostEl.className = 'char-card ghost';
  const rect = card.getBoundingClientRect();
  touchOffset.x = touch.clientX - rect.left - rect.width / 2;
  touchOffset.y = touch.clientY - rect.top - rect.height / 2;
  ghostEl.style.width = rect.width + 'px';
  ghostEl.style.height = rect.height + 'px';
  ghostEl.style.left = (touch.clientX - rect.width / 2) + 'px';
  ghostEl.style.top  = (touch.clientY - rect.height / 2) + 'px';
  document.body.appendChild(ghostEl);
}

function touchMove(e) {
  e.preventDefault();
  if (!ghostEl) return;
  const touch = e.touches[0];
  const rect = ghostEl.getBoundingClientRect();
  ghostEl.style.left = (touch.clientX - rect.width / 2) + 'px';
  ghostEl.style.top  = (touch.clientY - rect.height / 2) + 'px';

  // 高亮懸浮的 slot
  document.querySelectorAll('.drop-slot').forEach(s => s.classList.remove('drag-over'));
  const el = document.elementFromPoint(touch.clientX, touch.clientY);
  const slot = el && el.closest('.drop-slot');
  if (slot) slot.classList.add('drag-over');
}

function touchEnd(e) {
  e.preventDefault();
  if (ghostEl) { ghostEl.remove(); ghostEl = null; }
  if (!dragCard) return;
  dragCard.el.classList.remove('dragging');

  const touch = e.changedTouches[0];
  document.querySelectorAll('.drop-slot').forEach(s => s.classList.remove('drag-over'));
  const el = document.elementFromPoint(touch.clientX, touch.clientY);
  const slotEl = el && el.closest('.drop-slot');
  if (slotEl) {
    handleDrop(slotEl);
  } else {
    // 拖到空白處：錯誤閃爍
    playWrong();
    const card = dragCard.el;
    card.classList.add('wrong-flash');
    setTimeout(() => card.classList.remove('wrong-flash'), 220);
  }
  dragCard = null;
}

// ════════════════════════════════════════
//  下一題 / 結果
// ════════════════════════════════════════
nextBtn.addEventListener('click', () => {
  currentQ++;
  if (currentQ < 5) {
    loadQuestion();
  } else {
    showResult();
  }
});

function showResult() {
  // 補上未答完的題（若有）
  while (results.length < 5) {
    results.push({ 成語: questions[results.length].成語, ok: false });
  }
  if (!localStorage.getItem('adventure_start')) localStorage.setItem('adventure_start', Date.now());
  localStorage.setItem('cert_idiom', '1');
  updateProgressBar();
  idiomRow.style.display = 'none';
  meaningBox.style.display = 'none';
  cardsArea.style.display = 'none';
  questionLabel.style.display = 'none';
  nextBtn.style.display = 'none';
  resultScreen.style.display = 'block';
  scoreNum.textContent = `${score} / 5`;

  resultList.innerHTML = '';
  results.forEach(r => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="${r.ok ? 'r-ok' : 'r-bad'}">${r.ok ? '✓' : '✗'}</span><span class="r-idiom">${r.成語}</span>`;
    resultList.appendChild(li);
  });
}

restartBtn.addEventListener('click', startGame);

// ════════════════════════════════════════
//  啟動
// ════════════════════════════════════════
startGame();
</script>
